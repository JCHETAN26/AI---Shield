<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shield - Mitigation in Progress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .progress-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .strategy-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border-left: 4px solid #dee2e6;
        }
        .strategy-item.running {
            border-left-color: #ffc107;
            background-color: #fff3cd;
        }
        .strategy-item.completed {
            border-left-color: #28a745;
            background-color: #d4edda;
        }
        .spinner-grow-sm {
            width: 1rem;
            height: 1rem;
        }
        .mitigation-icon {
            font-size: 3rem;
            color: #ffc107;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-shield-alt me-2"></i>AI Shield
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/upload">Upload</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="progress-container">
            <div class="card">
                <div class="card-header bg-warning text-dark text-center">
                    <div class="mitigation-icon mb-2">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <h4>Applying Mitigation Strategies</h4>
                    <small>Hardening your model against adversarial attacks...</small>
                </div>
                <div class="card-body">
                    <!-- Progress Bar -->
                    <div class="mb-4">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Overall Progress</span>
                            <span id="progressText">0%</span>
                        </div>
                        <div class="progress" style="height: 20px;">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                 role="progressbar" 
                                 id="progressBar"
                                 style="width: 0%"
                                 aria-valuenow="0" 
                                 aria-valuemin="0" 
                                 aria-valuemax="100">
                            </div>
                        </div>
                    </div>

                    <!-- Current Status -->
                    <div class="alert alert-info d-flex align-items-center mb-4">
                        <div class="spinner-grow spinner-grow-sm text-info me-3" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <div>
                            <strong>Status:</strong> <span id="statusMessage">Initializing mitigation engine...</span>
                        </div>
                    </div>

                    <!-- Selected Strategies (will be populated by JavaScript) -->
                    <div class="mb-4">
                        <h6>Selected Mitigation Strategies:</h6>
                        <div id="strategiesList">
                            <!-- Strategies will be added here dynamically -->
                        </div>
                    </div>

                    <!-- Log Messages -->
                    <div class="mb-4">
                        <h6>Process Log:</h6>
                        <div class="border rounded p-3" style="height: 200px; overflow-y: auto; background-color: #f8f9fa;">
                            <div id="logMessages">
                                <div class="text-muted small">
                                    <i class="fas fa-clock me-1"></i>
                                    <span id="startTime"></span> - Mitigation process started
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="text-center">
                        <button class="btn btn-secondary" onclick="window.location.reload()">
                            <i class="fas fa-sync-alt me-2"></i>Refresh Status
                        </button>
                        <a href="/results/{{ original_session }}" class="btn btn-outline-secondary ms-2">
                            <i class="fas fa-arrow-left me-2"></i>Back to Original Results
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const sessionId = '{{ session_id }}';
        let lastLogCount = 0;

        // Strategy display names and icons
        const strategyInfo = {
            'adversarial_training': {
                name: 'Adversarial Training',
                icon: 'fas fa-dumbbell',
                color: 'primary'
            },
            'defensive_distillation': {
                name: 'Defensive Distillation',
                icon: 'fas fa-filter',
                color: 'success'
            },
            'feature_preprocessing': {
                name: 'Feature Preprocessing',
                icon: 'fas fa-cogs',
                color: 'info'
            },
            'ensemble_defense': {
                name: 'Ensemble Defense',
                icon: 'fas fa-users',
                color: 'warning'
            },
            'anomaly_detection': {
                name: 'Anomaly Detection',
                icon: 'fas fa-search',
                color: 'danger'
            }
        };

        function updateProgress() {
            fetch(`/status/${sessionId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        console.error('Error fetching status:', data.error);
                        return;
                    }

                    // Update progress bar
                    const progress = data.progress || 0;
                    document.getElementById('progressBar').style.width = progress + '%';
                    document.getElementById('progressBar').setAttribute('aria-valuenow', progress);
                    document.getElementById('progressText').textContent = progress + '%';

                    // Update status message
                    if (data.message) {
                        document.getElementById('statusMessage').textContent = data.message;
                    }

                    // Add log message if new
                    if (data.message && lastLogCount === 0) {
                        addLogMessage(data.message);
                        lastLogCount = 1;
                    }

                    // Update strategies list
                    if (data.selected_strategies && document.getElementById('strategiesList').children.length === 0) {
                        updateStrategiesList(data.selected_strategies);
                    }

                    // Check if completed
                    if (data.status === 'completed') {
                        // Redirect to results
                        setTimeout(() => {
                            window.location.href = `/mitigation_results/${sessionId}`;
                        }, 2000);
                    } else if (data.status === 'failed') {
                        // Show error
                        document.getElementById('statusMessage').textContent = data.error || 'Mitigation failed';
                        document.querySelector('.alert-info').className = 'alert alert-danger d-flex align-items-center mb-4';
                        addLogMessage(`ERROR: ${data.error || 'Mitigation failed'}`, 'danger');
                    }
                })
                .catch(error => {
                    console.error('Error fetching progress:', error);
                    addLogMessage(`Connection error: ${error.message}`, 'warning');
                });
        }

        function updateStrategiesList(strategies) {
            const container = document.getElementById('strategiesList');
            container.innerHTML = '';

            strategies.forEach(strategy => {
                const info = strategyInfo[strategy] || { name: strategy, icon: 'fas fa-cog', color: 'secondary' };
                const div = document.createElement('div');
                div.className = 'strategy-item';
                div.innerHTML = `
                    <i class="${info.icon} text-${info.color} me-2"></i>
                    ${info.name}
                    <span class="float-end">
                        <small class="text-muted">Pending</small>
                    </span>
                `;
                container.appendChild(div);
            });
        }

        function addLogMessage(message, type = 'info') {
            const logContainer = document.getElementById('logMessages');
            const timestamp = new Date().toLocaleTimeString();
            
            const logEntry = document.createElement('div');
            logEntry.className = `text-${type} small mb-1`;
            logEntry.innerHTML = `
                <i class="fas fa-clock me-1"></i>
                ${timestamp} - ${message}
            `;
            
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Set start time
            document.getElementById('startTime').textContent = new Date().toLocaleTimeString();
            
            // Start progress polling
            updateProgress();
            const progressInterval = setInterval(() => {
                updateProgress();
            }, 2000);

            // Stop polling after 10 minutes (timeout)
            setTimeout(() => {
                clearInterval(progressInterval);
                addLogMessage('Process timeout - please refresh page or check server logs', 'warning');
            }, 600000);
        });
    </script>
</body>
</html>
